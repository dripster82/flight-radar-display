<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Settings</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body { font: 17px var(--font); user-select: none; display: flex; flex-direction: column; min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; touch-action: manipulation; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 52px; }
  header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; color: var(--strong);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { padding: 0 12px 6px; min-height: 26px; font-size: 15px; color: var(--muted); }
  #status.error { color: var(--bad); }
  .action { background: var(--panel); border-radius: 8px; padding: 8px 16px; min-height: 36px; }
  .action.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }

  #networks { margin: 0; padding: 0 12px 12px; list-style: none; }
  #networks li { display: flex; gap: 6px; margin-bottom: 6px; }
  #networks .network { display: flex; flex: 1; min-width: 0; align-items: center; gap: 12px; text-align: left;
                       background: var(--panel); border-radius: 8px; padding: 0 14px; min-height: 52px; }
  #networks .forget { background: var(--panel); border-radius: 8px; padding: 0 14px; font-size: 14px; color: var(--muted); }
  #networks .forget.confirm { background: var(--danger); color: #ffffff; }
  #networks .name { flex: 1; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #networks .meta { font-size: 14px; color: var(--muted); }
  #networks .connected .meta { color: var(--ok); }

  #display { display: flex; align-items: center; gap: 10px; padding: 8px 12px 0; }
  #display .label { flex: 1; color: var(--strong); font-weight: 600; font-size: 18px; }
  #display #level { min-width: 52px; text-align: center; }
  #display .action { min-width: 48px; }
  #display .action.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }

  #home { display: flex; align-items: center; gap: 10px; padding: 8px 12px 0; }
  #home .label { color: var(--strong); font-weight: 600; font-size: 18px; }
  #home #homeText { flex: 1; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #home .action:disabled { opacity: .45; }
  #home .action.confirm { background: var(--danger); color: #ffffff; }
  #home .action.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  #home .action { white-space: nowrap; }

  #entry { flex: 1; display: flex; flex-direction: column; }
  #password { margin: 0 12px 8px; padding: 0 12px; height: 44px; line-height: 42px; border-radius: 8px;
              background: var(--panel); color: var(--strong); font: 20px ui-monospace, monospace;
              white-space: pre; overflow: hidden; direction: rtl; text-align: left; }
  #password:empty::before { content: 'Password'; color: var(--muted); font-family: var(--font); }
  #keys { flex: 1; display: flex; flex-direction: column; gap: 5px; padding: 0 5px 5px; }
  #keys .row { flex: 1; display: flex; gap: 5px; }
  #keys button { flex: 1; min-width: 0; background: var(--key); border-radius: 6px; font-size: 22px; color: var(--strong); }
  #keys button:active { background: var(--key-active); }
  #keys button.wide { flex: 1.6; font-size: 16px; background: var(--panel); }
  #keys button.space { flex: 5; }
  #keys button.on { background: var(--accent); color: var(--accent-text); }

  #restored { white-space: pre-line; margin: 8px 12px 0; padding: 10px 12px; border-radius: 8px; background: var(--danger); color: #ffffff; font-size: 15px; }
  .choices { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }
  .choices .label { flex: 1; color: var(--strong); font-weight: 600; font-size: 18px; }
  .choices .action.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
</style>
</head>
<body>
  <div id="display" hidden>
    <span class="label">Brightness</span>
    <button class="action" id="darker" aria-label="Darker">−</button>
    <span id="level"></span>
    <button class="action" id="brighter" aria-label="Brighter">+</button>
    <button class="action" id="nightDim"></button>
  </div>
  <div id="home">
    <span class="label">Home</span>
    <span id="homeText"></span>
    <button class="action" id="feedWait"></button>
    <button class="action" id="setHome">Set home to GPS position</button>
  </div>
  <div id="restored" hidden></div>
  <div id="themes" class="choices">
    <span class="label">Theme</span>
  </div>
  <div id="mapStyles" class="choices">
    <span class="label">Local map</span>
  </div>
  <div id="mapOptions" class="choices">
    <span class="label">Map shows</span>
  </div>
  <header>
    <h1 id="title">Wi-Fi networks</h1>
    <button class="action" id="refresh">Refresh</button>
    <button class="action" id="cancel" hidden>Cancel</button>
    <button class="action primary" id="join" hidden>Join</button>
  </header>
  <div id="status" role="status"></div>
  <ul id="networks"></ul>
  <div id="entry" hidden>
    <div id="password" aria-label="Password"></div>
    <div id="keys"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const LAYERS = {
    abc: ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'],
    num: ['1234567890', '@#£$%&*-+=', '!"\'():;/?'],
    sym: ['~`|\\{}[]<>', '^_,.€', ''],
  };
  let layer = 'abc', shift = false, password = '', target = null, busy = false;
  let screen = null; // brightness settings; stays null where the backlight cannot be controlled

  function drawDisplay() {
    $('display').hidden = !screen || !screen.available || Boolean(target);
    for (const id of ['themes', 'mapStyles', 'mapOptions']) $(id).hidden = !screen || Boolean(target);
    if (!screen) return;
    document.documentElement.dataset.theme = screen.theme;
    // One button per choice; the current one is highlighted.
    const choices = (rowId, options, current, key) => {
      if (!document.querySelector(`#${rowId} button`)) {
        for (const option of options) {
          const b = document.createElement('button');
          b.className = 'action';
          b.dataset.id = option.id;
          b.textContent = option.name;
          b.addEventListener('click', () => setDisplay({ [key]: option.id }));
          $(rowId).append(b);
        }
      }
      for (const b of document.querySelectorAll(`#${rowId} button`)) b.classList.toggle('on', b.dataset.id === current);
    };
    choices('themes', screen.themes, screen.theme, 'theme');
    choices('mapStyles', screen.mapStyles, screen.mapStyle, 'mapStyle');
    // Switches: each extra is on or off by itself.
    if (!document.querySelector('#mapOptions button')) {
      for (const option of screen.mapOptionList) {
        const b = document.createElement('button');
        b.className = 'action';
        b.dataset.id = option.id;
        b.textContent = option.name;
        b.addEventListener('click', () => setDisplay({ mapOptions: { [option.id]: !screen.mapOptions[option.id] } }));
        $('mapOptions').append(b);
      }
    }
    for (const b of document.querySelectorAll('#mapOptions button')) {
      b.classList.toggle('on', Boolean(screen.mapOptions[b.dataset.id]));
      b.setAttribute('aria-pressed', Boolean(screen.mapOptions[b.dataset.id]));
    }
    $('level').textContent = `${screen.brightness}%`;
    $('nightDim').textContent = screen.night ? `Dim ${screen.night.from}–${screen.night.to}: ${screen.nightDim ? 'On' : 'Off'}` : '';
    $('nightDim').hidden = !screen.night;
    $('nightDim').classList.toggle('on', screen.nightDim);
  }
  // Home position: where the device lives. Resetting it to the GPS position is for after a house move.
  let homeConfirm = null;
  function drawHome(info, note) {
    $('home').hidden = Boolean(target);
    const at = info.home ? `${info.home.latitude.toFixed(4)}, ${info.home.longitude.toFixed(4)}` : 'not set';
    const gps = !info.hasGps ? 'no GPS fix' : info.distanceKm === null ? 'GPS ready' : `GPS is ${info.distanceKm < 10 ? info.distanceKm.toFixed(1) : Math.round(info.distanceKm)} km away`;
    $('homeText').textContent = note || `${at} · ${gps}`;
    $('setHome').disabled = !info.hasGps;
    $('feedWait').textContent = `Feed waits for GPS: ${info.feedRequiresGps ? 'On' : 'Off'}`;
    $('feedWait').classList.toggle('on', info.feedRequiresGps);
    $('feedWait').dataset.on = info.feedRequiresGps ? '1' : '';
  }
  async function refreshHome() { if (!homeConfirm) drawHome(await window.radar.homeGet()); }
  function endHomeConfirm() {
    clearTimeout(homeConfirm); homeConfirm = null;
    $('setHome').classList.remove('confirm'); $('setHome').textContent = 'Set home to GPS position';
  }

  async function setDisplay(patch) { screen = await window.radar.displaySet(patch); drawDisplay(); }

  function setStatus(text, isError = false) {
    $('status').textContent = text;
    $('status').classList.toggle('error', isError);
  }

  function showList() {
    target = null;
    $('title').textContent = 'Wi-Fi networks';
    for (const [id, hidden] of [['networks', false], ['refresh', false], ['entry', true], ['cancel', true], ['join', true]]) $(id).hidden = hidden;
    $('home').hidden = false;
    drawDisplay();
  }

  function showEntry(network) {
    target = network; password = ''; layer = 'abc'; shift = false;
    $('title').textContent = network.ssid;
    for (const [id, hidden] of [['networks', true], ['refresh', true], ['entry', false], ['cancel', false], ['join', false]]) $(id).hidden = hidden;
    $('home').hidden = true;
    drawKeys(); drawPassword(); drawDisplay();
  }

  // Shown in the clear: on a touchscreen with no keyboard, seeing what was typed matters more than hiding it.
  function drawPassword() {
    $('password').textContent = password;
    setStatus('Enter the password, then Join.'); // typing clears any earlier error
  }

  function key(label, onPress, className) {
    const b = document.createElement('button');
    b.textContent = label;
    if (className) b.className = className;
    b.addEventListener('click', onPress);
    return b;
  }

  function drawKeys() {
    const keys = $('keys');
    keys.replaceChildren();
    const type = (ch) => () => {
      if (password.length < 63) password += ch; // WPA passwords are at most 63 characters
      if (shift) { shift = false; drawKeys(); }
      drawPassword();
    };
    LAYERS[layer].forEach((chars, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      if (i === 2) {
        row.append(layer === 'abc'
          ? key('Shift', () => { shift = !shift; drawKeys(); }, 'wide' + (shift ? ' on' : ''))
          : key(layer === 'num' ? '#+=' : '123', () => { layer = layer === 'num' ? 'sym' : 'num'; drawKeys(); }, 'wide'));
      }
      for (const ch of chars) {
        const out = layer === 'abc' && shift ? ch.toUpperCase() : ch;
        row.append(key(out, type(out)));
      }
      if (i === 2) row.append(key('Delete', () => { password = password.slice(0, -1); drawPassword(); }, 'wide'));
      keys.append(row);
    });
    const last = document.createElement('div');
    last.className = 'row';
    last.append(
      key(layer === 'abc' ? '123' : 'ABC', () => { layer = layer === 'abc' ? 'num' : 'abc'; shift = false; drawKeys(); }, 'wide'),
      key('space', type(' '), 'wide space'),
    );
    keys.append(last);
  }

  async function refresh() {
    if (busy) return;
    setStatus('Looking for networks…');
    const { result, error } = await window.radar.wifiList();
    if (target) return; // the password screen opened meanwhile; leave it alone
    if (error) return setStatus(error, true);
    const list = $('networks');
    list.replaceChildren();
    for (const network of result) {
      const b = document.createElement('button');
      b.className = 'network' + (network.connected ? ' connected' : '');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = network.ssid; // network names are untrusted text
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = network.connected ? 'Connected'
        : `${network.saved ? 'Saved' : network.secured ? 'Password' : 'Open'} · signal ${network.signal}%`;
      b.append(name, meta);
      b.addEventListener('click', () => {
        if (network.connected) return;
        // A saved network already has its password, so it joins straight away.
        if (network.secured && !network.saved) showEntry(network); else join(network, '');
      });
      const li = document.createElement('li');
      li.append(b);
      if (network.saved) li.append(forgetButton(network));
      list.append(li);
    }
    setStatus(result.length ? '' : 'No networks found.');
  }

  // Forgetting needs a second tap, because it throws away the saved password.
  function forgetButton(network) {
    const b = document.createElement('button');
    b.className = 'forget';
    b.textContent = 'Forget';
    b.addEventListener('click', async () => {
      if (busy) return;
      if (!b.classList.contains('confirm')) {
        b.classList.add('confirm');
        b.textContent = 'Tap again to forget';
        setTimeout(() => { b.classList.remove('confirm'); b.textContent = 'Forget'; }, 4000);
        return;
      }
      busy = true;
      const { error } = await window.radar.wifiForget(network.ssid);
      busy = false;
      await refresh();
      setStatus(error ? `Could not forget: ${error}` : `Forgot ${network.ssid}.`, Boolean(error));
    });
    return b;
  }

  async function join(network, pass) {
    if (busy) return;
    busy = true;
    setStatus(`Joining ${network.ssid}…`);
    const { error } = await window.radar.wifiConnect(network.ssid, pass);
    busy = false;
    if (error) {
      if (!target) await refresh(); // a saved network that failed: redraw so it can be forgotten
      return setStatus(`Could not join: ${error}`, true);
    }
    showList();
    await refresh();
    setStatus(`Connected to ${network.ssid}.`);
  }

  $('refresh').addEventListener('click', refresh);
  $('cancel').addEventListener('click', () => { if (!busy) { showList(); setStatus(''); } });
  $('join').addEventListener('click', () => {
    if (password.length < 8) return setStatus('Wi-Fi passwords are at least 8 characters.', true);
    join(target, password);
  });
  $('darker').addEventListener('click', () => setDisplay({ brightness: screen.brightness - 10 }));
  $('brighter').addEventListener('click', () => setDisplay({ brightness: screen.brightness + 10 }));
  $('nightDim').addEventListener('click', () => setDisplay({ nightDim: !screen.nightDim }));
  // Changing home needs a second tap: it decides where the Flightradar24 feed is allowed to run.
  $('setHome').addEventListener('click', async () => {
    if (!homeConfirm) {
      $('setHome').classList.add('confirm'); $('setHome').textContent = 'Tap again to confirm';
      homeConfirm = setTimeout(() => { endHomeConfirm(); refreshHome(); }, 4000);
      return;
    }
    endHomeConfirm();
    const { result, error } = await window.radar.homeSet();
    if (error) return drawHome(await window.radar.homeGet(), error);
    drawHome(result, result.receiverUpdated ? 'Home updated to the GPS position.' : 'Home updated, but the receiver\'s own location could not be changed.');
  });
  $('feedWait').addEventListener('click', async () => drawHome(await window.radar.homeFeedWait(!$('feedWait').dataset.on)));
  refreshHome();
  setInterval(refreshHome, 5000);
  window.radar.displayGet().then((d) => {
    screen = d;
    drawDisplay();
    if (d.storageRestored) {
      $('restored').textContent = d.storageRestored; // written by scripts/data-area.sh when it had to restore something, one line per area
      $('restored').hidden = false;
    }
  });
  window.radar.onActive((name) => { if (name === 'wifi' && !target) refresh(); });
</script>
</body>
</html>
