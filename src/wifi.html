<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Settings</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body { font: 17px var(--font); user-select: none; display: flex; flex-direction: column; min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; touch-action: manipulation; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 52px; }
  header h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; color: var(--strong);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { padding: 0 12px 6px; min-height: 26px; font-size: 15px; color: var(--muted); }
  #status.error { color: var(--bad); }
  .action { background: var(--panel); border-radius: 8px; padding: 8px 16px; min-height: 36px; }
  .action.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }

  #networks { margin: 0; padding: 0 12px 12px; list-style: none; }
  #networks li { display: flex; gap: 6px; margin-bottom: 6px; }
  #networks .network { display: flex; flex: 1; min-width: 0; align-items: center; gap: 12px; text-align: left;
                       background: var(--panel); border-radius: 8px; padding: 0 14px; min-height: 52px; }
  #networks .forget { background: var(--panel); border-radius: 8px; padding: 0 14px; font-size: 14px; color: var(--muted); }
  #networks .forget.confirm { background: var(--danger); color: #ffffff; }
  #networks .name { flex: 1; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #networks .meta { font-size: 14px; color: var(--muted); }
  #networks .connected .meta { color: var(--ok); }

  #display { display: flex; align-items: center; gap: 10px; padding: 8px 12px 0; }
  #display .label { flex: 1; color: var(--strong); font-weight: 600; font-size: 18px; }
  #display #level { min-width: 52px; text-align: center; }
  #display .action { min-width: 48px; }
  #display .action.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }

  .where { display: flex; align-items: center; gap: 10px; padding: 8px 12px 0; }
  .where .label { color: var(--strong); font-weight: 600; font-size: 18px; }
  .where .text { flex: 1; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where .action:disabled { opacity: .45; }
  .where .action.confirm { background: var(--danger); color: #ffffff; }
  .where .action.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .where .action { white-space: nowrap; }

  #entry { flex: 1; display: flex; flex-direction: column; }
  #keys { padding: 0 5px 5px; }
  #password { margin: 0 12px 8px; padding: 0 12px; height: 44px; line-height: 42px; border-radius: 8px;
              background: var(--panel); color: var(--strong); font: 20px ui-monospace, monospace;
              white-space: pre; overflow: hidden; direction: rtl; text-align: left; }
  #password:empty::before { content: attr(data-hint); color: var(--muted); font-family: var(--font); }
  #restored { white-space: pre-line; margin: 8px 12px 0; padding: 10px 12px; border-radius: 8px; background: var(--danger); color: #ffffff; font-size: 15px; }
  .choices { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }
  .choices .label { flex: 1; color: var(--strong); font-weight: 600; font-size: 18px; }
  .choices .action.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .choices .action.confirm { background: var(--danger); color: #ffffff; }
  #diagnostics { padding-bottom: 12px; }
  #updateText { white-space: normal; }
  #updates .action.confirm { background: var(--danger); color: #ffffff; }
  #logView { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: var(--bg); }
  #logLines { flex: 1; margin: 0; padding: 0 12px 12px; overflow: auto; user-select: text;
              font: 12px/1.5 ui-monospace, monospace; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  #logLines .bad { color: var(--bad); }
</style>
</head>
<body>
  <div id="display" hidden>
    <span class="label">Brightness</span>
    <button class="action" id="darker" aria-label="Darker">−</button>
    <span id="level"></span>
    <button class="action" id="brighter" aria-label="Brighter">+</button>
    <button class="action" id="nightDim"></button>
  </div>
  <div id="home" class="where">
    <span class="label">Home</span>
    <span id="homeText" class="text"></span>
    <button class="action" id="setPostcode">Set by postcode</button>
    <button class="action" id="setHome">Set home to GPS position</button>
  </div>
  <div id="place" class="where">
    <span class="label">Location</span>
    <span id="placeText" class="text"></span>
    <button class="action" id="feedWait"></button>
    <button class="action" id="useGps">Use GPS position now</button>
  </div>
  <div id="restored" hidden></div>
  <div id="themes" class="choices">
    <span class="label">Theme</span>
  </div>
  <div id="mapStyles" class="choices">
    <span class="label">Local map</span>
  </div>
  <div id="mapOptions" class="choices">
    <span class="label">Map shows</span>
  </div>
  <div id="fr24" class="choices">
    <span class="label">Flightradar24</span>
    <button class="action" id="fr24Home">Back to start page</button>
    <button class="action" id="fr24SignOut">Sign out and start again</button>
  </div>
  <div id="welcome" class="choices" hidden>
    <span class="label">Message</span>
    <button class="action" id="welcomeShow">View Christmas message</button>
  </div>
  <header>
    <h1 id="title">Wi-Fi networks</h1>
    <button class="action" id="refresh">Refresh</button>
    <button class="action" id="cancel" hidden>Cancel</button>
    <button class="action primary" id="join" hidden>Join</button>
  </header>
  <div id="status" role="status"></div>
  <ul id="networks"></ul>
  <div id="updates" class="where">
    <span class="label">Updates</span>
    <span id="updateText" class="text"></span>
    <button class="action" id="updateCheck">Check for updates</button>
    <button class="action primary" id="updateStart" hidden>Update now</button>
  </div>
  <div id="diagnostics" class="choices">
    <span class="label">Diagnostics</span>
    <button class="action" id="logShow">View log</button>
  </div>
  <div id="logView" hidden>
    <header>
      <h1>Log, newest first</h1>
      <button class="action" id="logRefresh">Refresh</button>
      <button class="action primary" id="logClose">Close</button>
    </header>
    <div id="logLines"></div>
  </div>
  <div id="entry" hidden>
    <div id="password" aria-label="Password" data-hint="Password"></div>
    <div id="keys"></div>
  </div>

<script src="keys.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let password = '', target = null, busy = false;
  let screen = null; // brightness settings; stays null where the backlight cannot be controlled
  let hasWelcome = false;

  function drawDisplay() {
    $('display').hidden = !screen || !screen.available || Boolean(target);
    for (const id of ['themes', 'mapStyles', 'mapOptions', 'fr24']) $(id).hidden = !screen || Boolean(target);
    $('welcome').hidden = !hasWelcome || Boolean(target);
    $('diagnostics').hidden = $('updates').hidden = Boolean(target);
    if (!screen) return;
    document.documentElement.dataset.theme = screen.theme;
    // One button per choice; the current one is highlighted.
    const choices = (rowId, options, current, key) => {
      if (!document.querySelector(`#${rowId} button`)) {
        for (const option of options) {
          const b = document.createElement('button');
          b.className = 'action';
          b.dataset.id = option.id;
          b.textContent = option.name;
          b.addEventListener('click', () => setDisplay({ [key]: option.id }));
          $(rowId).append(b);
        }
      }
      for (const b of document.querySelectorAll(`#${rowId} button`)) b.classList.toggle('on', b.dataset.id === current);
    };
    choices('themes', screen.themes, screen.theme, 'theme');
    choices('mapStyles', screen.mapStyles, screen.mapStyle, 'mapStyle');
    // Switches: each extra is on or off by itself.
    if (!document.querySelector('#mapOptions button')) {
      for (const option of screen.mapOptionList) {
        const b = document.createElement('button');
        b.className = 'action';
        b.dataset.id = option.id;
        b.textContent = option.name;
        b.addEventListener('click', () => setDisplay({ mapOptions: { [option.id]: !screen.mapOptions[option.id] } }));
        $('mapOptions').append(b);
      }
    }
    for (const b of document.querySelectorAll('#mapOptions button')) {
      b.classList.toggle('on', Boolean(screen.mapOptions[b.dataset.id]));
      b.setAttribute('aria-pressed', Boolean(screen.mapOptions[b.dataset.id]));
    }
    $('level').textContent = `${screen.brightness}%`;
    $('nightDim').textContent = screen.night ? `Dim ${screen.night.from}–${screen.night.to}: ${screen.nightDim ? 'On' : 'Off'}` : '';
    $('nightDim').hidden = !screen.night;
    $('nightDim').classList.toggle('on', screen.nightDim);
  }
  // Home is the pin: where the device lives, set from a postcode or from the GPS. Location is the
  // position in use: the pin while the GPS is within 2 miles of it, otherwise a held GPS position.
  let homeConfirm = null;
  const coords = (p) => `${p.latitude.toFixed(4)}, ${p.longitude.toFixed(4)}`;
  function drawHome(info, note) {
    $('home').hidden = $('place').hidden = Boolean(target);
    $('homeText').textContent = note || (info.home ? `${info.postcode ? `${info.postcode} · ` : ''}${coords(info.home)}` : 'not set');
    const where = info.atHome ? 'At home' : info.current ? `Away, at ${coords(info.current)}` : 'Waiting for GPS';
    const gps = !info.hasGps ? 'no GPS fix' : info.distanceKm === null ? 'GPS ready' : `GPS is ${info.distanceKm < 10 ? info.distanceKm.toFixed(1) : Math.round(info.distanceKm)} km from here`;
    $('placeText').textContent = `${where} · ${gps}`;
    $('setHome').disabled = !info.hasGps;
    $('useGps').disabled = !info.hasGps || info.atHome; // at home the pin is used, so there is nothing to fix
    $('feedWait').textContent = `Feed waits for GPS: ${info.feedRequiresGps ? 'On' : 'Off'}`;
    $('feedWait').classList.toggle('on', info.feedRequiresGps);
    $('feedWait').dataset.on = info.feedRequiresGps ? '1' : '';
  }
  async function refreshHome() { if (!homeConfirm) drawHome(await window.radar.homeGet()); }
  function endHomeConfirm() {
    clearTimeout(homeConfirm); homeConfirm = null;
    $('setHome').classList.remove('confirm'); $('setHome').textContent = 'Set home to GPS position';
  }

  async function setDisplay(patch) { screen = await window.radar.displaySet(patch); drawDisplay(); }

  function setStatus(text, isError = false) {
    $('status').textContent = text;
    $('status').classList.toggle('error', isError);
  }

  function showList() {
    target = null;
    $('title').textContent = 'Wi-Fi networks';
    for (const [id, hidden] of [['networks', false], ['refresh', false], ['entry', true], ['cancel', true], ['join', true]]) $(id).hidden = hidden;
    $('home').hidden = $('place').hidden = false;
    $('join').textContent = 'Join';
    drawDisplay();
  }

  function showEntry(network) {
    target = network; password = '';
    $('title').textContent = network.ssid;
    for (const [id, hidden] of [['networks', true], ['refresh', true], ['entry', false], ['cancel', false], ['join', false]]) $(id).hidden = hidden;
    $('home').hidden = $('place').hidden = true;
    $('join').textContent = network.postcode ? 'Set' : 'Join';
    $('password').dataset.hint = network.postcode ? 'Postcode' : 'Password';
    keyboard.reset(); drawPassword(); drawDisplay();
  }

  const keyboard = onScreenKeyboard($('keys'), {
    // WPA passwords are at most 63 characters; a postcode is at most 8 with its space, and is shown in capitals.
    onType: (ch) => { if (password.length < (target.postcode ? 8 : 63)) password += target.postcode ? ch.toUpperCase() : ch; drawPassword(); },
    onDelete: () => { password = password.slice(0, -1); drawPassword(); },
    onEnter: () => $('join').click(),
  });

  // Shown in the clear: on a touchscreen with no keyboard, seeing what was typed matters more than hiding it.
  function drawPassword() {
    $('password').textContent = password;
    setStatus(target.postcode ? 'Enter the home postcode, then Set. This needs Wi-Fi.' : 'Enter the password, then Join.'); // typing clears any earlier error
  }

  async function refresh() {
    if (busy) return;
    setStatus('Looking for networks…');
    const { result, error } = await window.radar.wifiList();
    if (target) return; // the password screen opened meanwhile; leave it alone
    if (error) return setStatus(error, true);
    const list = $('networks');
    list.replaceChildren();
    for (const network of result) {
      const b = document.createElement('button');
      b.className = 'network' + (network.connected ? ' connected' : '');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = network.ssid; // network names are untrusted text
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = network.connected ? 'Connected'
        : `${network.saved ? 'Saved' : network.secured ? 'Password' : 'Open'} · signal ${network.signal}%`;
      b.append(name, meta);
      b.addEventListener('click', () => {
        if (network.connected) return;
        // A saved network already has its password, so it joins straight away.
        if (network.secured && !network.saved) showEntry(network); else join(network, '');
      });
      const li = document.createElement('li');
      li.append(b);
      if (network.saved) li.append(forgetButton(network));
      list.append(li);
    }
    setStatus(result.length ? '' : 'No networks found.');
  }

  // Forgetting needs a second tap, because it throws away the saved password.
  function forgetButton(network) {
    const b = document.createElement('button');
    b.className = 'forget';
    b.textContent = 'Forget';
    b.addEventListener('click', async () => {
      if (busy) return;
      if (!b.classList.contains('confirm')) {
        b.classList.add('confirm');
        b.textContent = 'Tap again to forget';
        setTimeout(() => { b.classList.remove('confirm'); b.textContent = 'Forget'; }, 4000);
        return;
      }
      busy = true;
      const { error } = await window.radar.wifiForget(network.ssid);
      busy = false;
      await refresh();
      setStatus(error ? `Could not forget: ${error}` : `Forgot ${network.ssid}.`, Boolean(error));
    });
    return b;
  }

  async function join(network, pass) {
    if (busy) return;
    busy = true;
    setStatus(`Joining ${network.ssid}…`);
    const { error } = await window.radar.wifiConnect(network.ssid, pass);
    busy = false;
    if (error) {
      if (!target) await refresh(); // a saved network that failed: redraw so it can be forgotten
      return setStatus(`Could not join: ${error}`, true);
    }
    showList();
    await refresh();
    setStatus(`Connected to ${network.ssid}.`);
  }

  $('refresh').addEventListener('click', refresh);
  $('cancel').addEventListener('click', () => { if (!busy) { showList(); setStatus(''); } });
  $('join').addEventListener('click', () => {
    if (target.postcode) return setPostcode();
    if (password.length < 8) return setStatus('Wi-Fi passwords are at least 8 characters.', true);
    join(target, password);
  });
  $('darker').addEventListener('click', () => setDisplay({ brightness: screen.brightness - 10 }));
  $('brighter').addEventListener('click', () => setDisplay({ brightness: screen.brightness + 10 }));
  $('nightDim').addEventListener('click', () => setDisplay({ nightDim: !screen.nightDim }));
  // Changing home needs a second tap: it decides where the Flightradar24 feed is allowed to run.
  $('setHome').addEventListener('click', async () => {
    if (!homeConfirm) {
      $('setHome').classList.add('confirm'); $('setHome').textContent = 'Tap again to confirm';
      homeConfirm = setTimeout(() => { endHomeConfirm(); refreshHome(); }, 4000);
      return;
    }
    endHomeConfirm();
    const { result, error } = await window.radar.homeSet();
    if (error) return drawHome(await window.radar.homeGet(), error);
    drawHome(result, 'Home updated to the GPS position.');
  });
  // The home pin from a postcode, typed on the same keyboard screen as a Wi-Fi password.
  $('setPostcode').addEventListener('click', () => showEntry({ postcode: true, ssid: 'Home postcode' }));
  async function setPostcode() {
    if (busy) return;
    busy = true;
    setStatus('Looking up the postcode…');
    const { result, error } = await window.radar.homePostcode(password);
    busy = false;
    if (error) return setStatus(error, true);
    showList();
    drawHome(result);
    setStatus(`Home set to ${result.postcode}.`);
  }
  $('useGps').addEventListener('click', async () => {
    const { result, error } = await window.radar.homeUseGps();
    if (error) return setStatus(error, true);
    drawHome(result);
    setStatus('Location set to the GPS position.');
  });
  // For when the Flightradar24 tab is stuck (a sign-in page that will not go away, or a page outside
  // Flightradar24). Both take you to that tab. Signing out needs a second tap: it throws away the sign-in.
  $('fr24Home').addEventListener('click', () => window.radar.tabHome('fr24'));
  let signOutConfirm = null;
  const endSignOutConfirm = () => { clearTimeout(signOutConfirm); signOutConfirm = null; $('fr24SignOut').classList.remove('confirm'); $('fr24SignOut').textContent = 'Sign out and start again'; };
  $('fr24SignOut').addEventListener('click', () => {
    if (!signOutConfirm) {
      $('fr24SignOut').classList.add('confirm'); $('fr24SignOut').textContent = 'Tap again to sign out';
      signOutConfirm = setTimeout(endSignOutConfirm, 4000);
      return;
    }
    endSignOutConfirm();
    window.radar.fr24SignOut();
  });
  // Only offered when config.json has a welcome title or message.
  window.radar.welcomeGet().then((text) => { hasWelcome = Boolean(text.title || text.message); $('welcome').hidden = !hasWelcome || Boolean(target); });
  $('welcomeShow').addEventListener('click', () => window.radar.welcomeShow());
  // Updates (src/update.js). Checking needs Wi-Fi. Installing needs a second tap, because it
  // restarts the app (and, with power-cut protection on, the whole device, twice).
  let updating = false, updateConfirm = null;
  const version = (info) => `This version: ${info.current}${info.lastUpdate ? ` · last update: ${info.lastUpdate.replace(/^\S+ \S+ /, '')}` : ''}`;
  const endUpdateConfirm = () => { clearTimeout(updateConfirm); updateConfirm = null; $('updateStart').classList.remove('confirm'); $('updateStart').textContent = 'Update now'; };
  window.radar.updateInfo().then((info) => { $('updateText').textContent = version(info); });
  $('updateCheck').addEventListener('click', async () => {
    if (updating) return;
    endUpdateConfirm();
    $('updateStart').hidden = true;
    $('updateText').textContent = 'Checking…';
    const { result, error } = await window.radar.updateCheck();
    if (error) return void ($('updateText').textContent = error);
    $('updateText').textContent = result.behind ? `Update available (${result.behind} change${result.behind === 1 ? '' : 's'}): ${result.latest}` : `Up to date. ${version(result)}`;
    $('updateStart').hidden = !result.behind || !result.canUpdate;
  });
  $('updateStart').addEventListener('click', async () => {
    if (updating) return;
    if (!updateConfirm) {
      $('updateStart').classList.add('confirm'); $('updateStart').textContent = 'Tap again to update';
      updateConfirm = setTimeout(endUpdateConfirm, 4000);
      return;
    }
    endUpdateConfirm();
    const { error } = await window.radar.updateStart();
    if (error) return void ($('updateText').textContent = error);
    updating = true;
    $('updateStart').hidden = $('updateCheck').hidden = true;
    $('updateText').textContent = 'Updating. Leave it plugged in: it restarts by itself when done, which takes several minutes.';
  });
  // The diagnostic log (src/log.js): the most recent lines, newest first. Trouble is picked out in red.
  async function drawLog() {
    const lines = await window.radar.logRead();
    $('logLines').replaceChildren(...lines.map((line) => {
      const row = document.createElement('div');
      row.textContent = line; // log lines can hold text from outside (network names, error messages)
      if (/^\S+ \S+ (error|crash) |FAILED|could not|could NOT|problem/.test(line)) row.className = 'bad';
      return row;
    }));
    if (!lines.length) $('logLines').textContent = 'The log is empty.';
    $('logLines').scrollTop = 0;
  }
  $('logShow').addEventListener('click', () => { $('logView').hidden = false; drawLog(); });
  $('logRefresh').addEventListener('click', drawLog);
  $('logClose').addEventListener('click', () => { $('logView').hidden = true; });
  $('feedWait').addEventListener('click', async () => drawHome(await window.radar.homeFeedWait(!$('feedWait').dataset.on)));
  refreshHome();
  setInterval(refreshHome, 5000);
  window.radar.displayGet().then((d) => {
    screen = d;
    drawDisplay();
    if (d.storageRestored) {
      $('restored').textContent = d.storageRestored; // written by scripts/data-area.sh when it had to restore something, one line per area
      $('restored').hidden = false;
    }
  });
  window.radar.onActive((name) => { if (name === 'wifi' && !target) refresh(); });
</script>
</body>
</html>
