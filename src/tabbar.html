<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>Tabs</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: stretch; font: 700 15px var(--font); user-select: none; border-bottom: 1px solid var(--line); box-sizing: border-box; }
  button {
    border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted);
    font: inherit; touch-action: manipulation; white-space: nowrap;
  }
  button.tab { flex: 1; letter-spacing: .08em; }
  button[aria-pressed="true"] { color: var(--strong); border-bottom-color: var(--accent); background: var(--panel); }
  button.back { flex: 0 0 60px; display: flex; align-items: center; justify-content: center; color: var(--accent); border-right: 1px solid var(--line); }
  button.gear { flex: 0 0 60px; display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--line); }

  [hidden] { display: none !important; }
  #status { display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .light {
    display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px;
    background: var(--panel); color: var(--text); font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .light::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
  .light[data-state="ok"]::before { background: var(--ok); }
  .light[data-state="bad"]::before { background: var(--bad); }
  .light[data-state="paused"]::before, .light[data-state="waiting"]::before { background: var(--warn); }
</style>
</head>
<body>
  <button class="tab" data-tab="local" aria-pressed="false">MY RECEIVER</button>
  <button class="tab" data-tab="fr24" aria-pressed="false">FLIGHTRADAR24</button>
  <!-- Only shown while the Flightradar24 tab is on some other site: takes it back to Flightradar24. -->
  <button class="back" id="back" aria-label="Return to Flightradar24" hidden>
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <div id="status">
    <span class="light" id="receiver" data-state="off">Receiver</span>
    <span class="light" id="feed" data-state="off">Feed</span>
    <span class="light" id="gps" data-state="off">GPS</span>
    <span class="light" id="wifi" data-state="off">Wi-Fi</span>
  </div>
  <button class="gear" data-tab="wifi" aria-pressed="false" aria-label="Settings">
    <!-- A cog (toothed wheel). Not a circle with rays, which reads as brightness. -->
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
<script>
  window.radar.onAway((name, away) => { if (name === 'fr24') document.getElementById('back').hidden = !away; });
  document.getElementById('back').addEventListener('click', () => window.radar.tabHome('fr24'));
  const buttons = document.querySelectorAll('button[data-tab]');
  buttons.forEach((b) => b.addEventListener('click', () => window.radar.select(b.dataset.tab)));
  window.radar.onActive((name) => {
    buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tab === name)));
  });

  // Green = working, red = not working, amber = held back on purpose, grey = not present on this machine.
  const MEANING = { ok: 'working', bad: 'not working', paused: 'paused while away from home', waiting: 'waiting for a GPS fix at home', off: 'not running' };
  function light(id, name, status, text) {
    const el = document.getElementById(id);
    el.dataset.state = status.state;
    el.setAttribute('aria-label', `${name}: ${MEANING[status.state]}`);
    if (text) el.textContent = text;
  }
  window.radar.onStatus((s) => {
    light('receiver', 'Receiver', s.receiver, s.receiver.state === 'ok' ? `${s.receiver.count} aircraft` : 'Receiver');
    light('feed', 'Flightradar24 feed', s.feed);
    light('gps', 'GPS', s.gps);
    light('wifi', 'Wi-Fi', s.wifi);
  });
</script>
</body>
</html>
